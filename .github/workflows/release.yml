name: Release

# Publishes the installable plugin archive to the releases page, which is
# where the install instructions send people.
#
# Either push a v* tag, or run this workflow manually — run manually and it
# reads the version from Plugin.php and creates the matching tag itself, so
# the tag and the plugin's declared version can never disagree.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the plugin archive
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve the version
        id: version
        run: |
          set -euo pipefail
          declared="$(grep -A2 'function getPluginVersion' Plugin.php | grep -oP "return '\K[^']+")"

          if [ -z "${declared}" ]; then
            echo "::error::could not read getPluginVersion() from Plugin.php"
            exit 1
          fi

          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            tag="${GITHUB_REF_NAME}"
            if [ "${tag#v}" != "${declared}" ]; then
              echo "::error::Plugin.php declares ${declared} but the tag is ${tag}"
              exit 1
            fi
          else
            tag="v${declared}"
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${declared}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${tag}"

      - name: Create the tag
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/${TAG}" > /dev/null; then
            echo "::error::${TAG} already exists — bump getPluginVersion() in Plugin.php first"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "${TAG}"
          git push origin "${TAG}"

      - name: Build the archive
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # The export-ignore rules in .gitattributes keep this to the files a
          # Kanboard installation actually loads.
          git archive HEAD --prefix=FrappeGantt/ --format=zip -o "FrappeGantt-${VERSION}.zip"
          unzip -l "FrappeGantt-${VERSION}.zip"

      - name: Sanity-check the archive
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          zip="FrappeGantt-${VERSION}.zip"

          # Kanboard derives the plugin namespace from the directory name, so
          # this has to unpack to exactly plugins/FrappeGantt/Plugin.php.
          for required in \
            FrappeGantt/Plugin.php \
            FrappeGantt/Assets/kanboard-gantt.js \
            FrappeGantt/Assets/kanboard-gantt.css \
            FrappeGantt/Assets/vendor/frappe-gantt.umd.js \
            FrappeGantt/Assets/vendor/frappe-gantt.css \
            FrappeGantt/Schema/Sqlite.php \
            FrappeGantt/Schema/Mysql.php \
            FrappeGantt/Schema/Postgres.php \
            FrappeGantt/Schema/Mssql.php \
            FrappeGantt/Schema/Dblib.php \
            FrappeGantt/Schema/Odbc.php \
            FrappeGantt/Template/gantt/chart.php
          do
            unzip -l "$zip" | grep -q " ${required}$" \
              || { echo "::error::${required} is missing from the archive"; exit 1; }
          done

          # Development-only files must not ship.
          if unzip -l "$zip" | grep -qE " FrappeGantt/(Test|docs|tools)/"; then
            echo "::error::development files leaked into the archive"
            exit 1
          fi

          echo "Archive looks good: $(du -h "$zip" | cut -f1)"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          if gh release view "${TAG}" > /dev/null 2>&1; then
            echo "::error::a release for ${TAG} already exists"
            exit 1
          fi

          frappe_version="$(sed -n 's/^FRAPPE_GANTT_VERSION=//p' Assets/vendor/VERSION)"

          cat > notes.md <<EOF
          Kanboard plugin rendering projects, tasks and subtasks with
          [Frappe Gantt](https://github.com/frappe/gantt) ${frappe_version}.

          ## Install

          Download \`FrappeGantt-${VERSION}.zip\` and unpack it into your Kanboard
          \`plugins\` directory, so that \`Plugin.php\` ends up at
          \`plugins/FrappeGantt/Plugin.php\`. The directory **must** be named
          \`FrappeGantt\` — Kanboard derives the plugin's namespace from it.

          The database table the plugin needs is created on the next request.
          No build step is required: the library is bundled pre-built.

          ## Requirements

          - Kanboard >= 1.2.20, PHP >= 8.1
          - Any database Kanboard supports: SQLite, MySQL/MariaDB, PostgreSQL
            and SQL Server

          See the [README](https://github.com/${GITHUB_REPOSITORY}/blob/main/README.md)
          for configuration and the full feature list.
          EOF

          gh release create "${TAG}" "FrappeGantt-${VERSION}.zip" \
            --title "v${VERSION}" \
            --notes-file notes.md \
            --verify-tag
